name: Daily Tools Radar Scraper

on:
  schedule:
    # Runs at 00:00 UTC every day (08:00 AM Beijing time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper
        env:
          AI_API_BASE: ${{ secrets.AI_API_BASE }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/scraper.py

      - name: Sync GitHub Metrics & Stars
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_metrics.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          python -c "import json, datetime; json.dump({'updated_at': datetime.datetime.now(datetime.timezone.utc).isoformat()}, open('site/src/data-timestamp.json', 'w', encoding='utf-8'), indent=2)"
          git add data/ site/
          if git diff --staged --quiet data/; then
            echo "No new tools found today. Working tree clean."
          else
            git commit -m "chore(data): auto-update daily tools $(date +'%Y-%m-%d')"
            git push origin main
          fi

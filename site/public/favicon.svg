<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="tr-bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0c0e17"/>
      <stop offset="100%" stop-color="#05070a"/>
    </linearGradient>

    <!-- Radar Sweep Glow Beam Gradient -->
    <linearGradient id="tr-beam" x1="24" y1="24" x2="42" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.85"/>
      <stop offset="70%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </linearGradient>

    <!-- Subtle Glow Filter -->
    <filter id="tr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Squircle with Micro Border -->
  <rect width="48" height="48" rx="12" fill="url(#tr-bg)"/>
  <rect width="48" height="48" rx="12" stroke="rgba(56, 189, 248, 0.28)" stroke-width="1.2"/>

  <!-- Coordinate Crosshairs -->
  <line x1="24" y1="7" x2="24" y2="41" stroke="rgba(129, 140, 248, 0.16)" stroke-width="1" stroke-dasharray="2 2"/>
  <line x1="7" y1="24" x2="41" y2="24" stroke="rgba(129, 140, 248, 0.16)" stroke-width="1" stroke-dasharray="2 2"/>

  <!-- Concentric Radar Rings -->
  <circle cx="24" cy="24" r="17" stroke="rgba(129, 140, 248, 0.25)" stroke-width="1.2"/>
  <circle cx="24" cy="24" r="11.5" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.2"/>
  <circle cx="24" cy="24" r="6" stroke="rgba(56, 189, 248, 0.75)" stroke-width="1.4"/>

  <!-- Radar Scanning Sector & Leading Edge Beam -->
  <path d="M 24 24 L 38 12 A 17 17 0 0 0 24 7 Z" fill="url(#tr-beam)"/>
  <line x1="24" y1="24" x2="38" y2="12" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" filter="url(#tr-glow)"/>

  <!-- Center Active Signal Core -->
  <circle cx="24" cy="24" r="2.5" fill="#ffffff" filter="url(#tr-glow)"/>
</svg>
